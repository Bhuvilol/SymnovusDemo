server {
    listen 80;
    root /usr/share/nginx/html;

    # Same paths the Vite dev server proxies in local development.
    location ~ ^/(devices|summary)(/|$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
